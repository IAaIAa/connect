<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Connect — პლატფორმა, სადაც ორგანიზაციები ერთმანეთს პოულობენ საერთო პროდუქტის შესაქმნელად.">
</head>
<body>
<title>Connect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wdth,wght@62.5..100,300..900&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: app shell — sticky bar with the cup-in-orbit mark, one working view below; the map and the network motif carry the Connect Coffee look */
:root{
  --bg:#f4f6f9; --surface:#ffffff; --sunk:#eaeef3; --ink:#18212d; --muted:#5a6677; --line:#d9e0e8;
  --blue:#2c62d0; --primary:#1e3a66; --orange:#b9802f; --green:#2f8566; --coffee:#4a5868; --river:#d3e0f5; --slate:#7a8797;
  --s-travel:#c47a3f; --s-edu:#2c62d0; --s-life:#8a7458; --s-biz:#5960c8; --s-culture:#a8508a; --s-social:#2f8566; --s-health:#22808f; --s-eco:#6a8a3a;
  --shadow:0 1px 2px rgba(20,35,60,.06),0 8px 24px rgba(20,35,60,.07);
  --f-display:"Noto Sans Georgian","Noto Sans","Segoe UI",system-ui,sans-serif;
  --f-body:"Noto Sans Georgian","Noto Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f141b; --surface:#171e28; --sunk:#131922; --ink:#e7ecf2; --muted:#9ba7b6; --line:#2a3442;
  --blue:#6f9bff; --primary:#3f6fd8; --orange:#e0a85c; --green:#5cc09a; --coffee:#aab6c4; --river:#1d2d47; --slate:#8794a5;
  --s-travel:#e5a06a; --s-edu:#6f9bff; --s-life:#c4ab8a; --s-biz:#9a9ff0; --s-culture:#d98abd; --s-social:#5cc09a; --s-health:#5cc3cf; --s-eco:#a7c473;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0f141b; --surface:#171e28; --sunk:#131922; --ink:#e7ecf2; --muted:#9ba7b6; --line:#2a3442;
  --blue:#6f9bff; --primary:#3f6fd8; --orange:#e0a85c; --green:#5cc09a; --coffee:#aab6c4; --river:#1d2d47; --slate:#8794a5;
  --s-travel:#e5a06a; --s-edu:#6f9bff; --s-life:#c4ab8a; --s-biz:#9a9ff0; --s-culture:#d98abd; --s-social:#5cc09a; --s-health:#5cc3cf; --s-eco:#a7c473;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);font-stretch:75%;font-variation-settings:"wdth" 75;line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:clamp(2rem,5vw,3.3rem);font-weight:850}
h2{font-size:clamp(1.4rem,2.6vw,1.85rem);font-weight:800}
h3{font-size:1.12rem;font-weight:750}
p{margin:0}
.eyebrow,.label{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}

/* shell */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar-in{max-width:1200px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:18px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer}
.brand b{font-family:var(--f-display);font-stretch:75%;font-variation-settings:"wdth" 75;font-weight:850;font-size:1.35rem;letter-spacing:.01em}
nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
nav::-webkit-scrollbar{display:none}
nav button{border:0;background:none;padding:8px 12px;border-radius:999px;white-space:nowrap;cursor:pointer;color:var(--muted);font-weight:550}
nav button:hover{color:var(--ink);background:var(--sunk)}
nav button[aria-current="page"]{background:var(--ink);color:var(--bg)}
main{max-width:1200px;margin:0 auto;padding-inline:16px;padding-block:28px 64px}
@media (min-width:720px){main{padding-inline:24px}}
.view{display:grid;gap:40px}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.section-head p{color:var(--muted);max-width:62ch}

/* controls */
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:999px;cursor:pointer;font-weight:600;transition:transform .12s,background .12s}
.btn:hover{transform:translateY(-1px)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.blue{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.ghost{background:none}
.btn.sm{padding:6px 12px;font-size:.86rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.link{background:none;border:0;padding:0;cursor:pointer;text-align:left;font:inherit;color:inherit}
.link:hover{color:var(--blue)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:.8rem;background:color-mix(in srgb,var(--c,var(--muted)) 13%,transparent);color:var(--ink);white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c,var(--muted))}
.tag{display:inline-block;padding:2px 9px;border-radius:6px;font-size:.8rem;border:1px solid var(--line);background:var(--surface)}
.tag.have{border-color:color-mix(in srgb,var(--green) 55%,var(--line));background:color-mix(in srgb,var(--green) 14%,var(--surface))}
.tag.need{border-color:color-mix(in srgb,var(--orange) 55%,var(--line));background:color-mix(in srgb,var(--orange) 16%,var(--surface))}
.tag.hit{background:color-mix(in srgb,var(--blue) 18%,var(--surface));border-color:var(--blue)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:.85rem;display:inline-flex;align-items:center;gap:6px}
.fchip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c,var(--muted))}
.fchip[aria-pressed="true"]{background:color-mix(in srgb,var(--c,var(--ink)) 16%,var(--surface));border-color:var(--c,var(--ink))}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.seg button{border:0;background:none;padding:5px 12px;border-radius:999px;cursor:pointer;font-size:.85rem}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
input[type=text],input[type=search],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px}
textarea{resize:vertical;min-height:90px}
label.f{display:grid;gap:6px;font-weight:600;font-size:.9rem}
label.f small{font-weight:400;color:var(--muted)}

/* hero */
.hero{display:grid;gap:28px;align-items:center}
@media (min-width:880px){.hero{grid-template-columns:1.1fr .9fr}}
.hero-text{display:grid;gap:18px}
.hero .lead{font-size:1.08rem;color:var(--muted);max-width:56ch}
.hero .meta{font-size:.86rem;color:var(--muted)}
.hero-art{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:8px;box-shadow:var(--shadow)}
.hero-art svg{display:block;width:100%;height:auto}
.orbit{transform-origin:200px 200px;animation:spin 60s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.orbit{animation:none}.btn:hover{transform:none}}

.steps{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));counter-reset:s}
.step{border-top:3px solid var(--c);padding-top:12px;display:grid;gap:6px}
.step .n{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.step p{color:var(--muted);font-size:.92rem}

/* cards */
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:12px;align-content:start;min-width:0}
.card .sub{display:flex;gap:6px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:.85rem}
.card .desc{color:var(--muted);font-size:.92rem}
.kv{display:grid;gap:6px}
.kv .tags{display:flex;gap:5px;flex-wrap:wrap}
.card .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.idea{background:var(--sunk);border-radius:12px;padding:12px 14px;display:grid;gap:4px}
.idea p{font-size:.9rem;color:var(--muted)}
.sug header{display:flex;gap:14px;align-items:center}
.pct{flex:none;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:.95rem;background:conic-gradient(var(--blue) calc(var(--p)*1%),var(--sunk) 0);position:relative}
.pct span{position:relative;z-index:1;background:var(--surface);width:46px;height:46px;border-radius:50%;display:grid;place-items:center}
.why{margin:0;padding:0;list-style:none;display:grid;gap:6px;font-size:.9rem}
.why li{display:flex;gap:8px}
.why li::before{content:"";flex:none;width:6px;height:6px;margin-top:.55em;border-radius:50%;background:var(--green)}
.badge{font-size:.72rem;padding:2px 8px;border-radius:999px;background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--ink)}
.empty{border:1px dashed var(--line);border-radius:16px;padding:24px;color:var(--muted);text-align:center}

.split{display:grid;gap:16px}
@media (min-width:860px){.split{grid-template-columns:1fr 1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;display:grid;gap:14px;align-content:start}
.panel.coffee{background:color-mix(in srgb,var(--blue) 6%,var(--surface))}
.qr-row{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.qr-row svg{flex:none}

/* map */
.map-wrap{display:grid;gap:16px}
@media (min-width:980px){.map-wrap{grid-template-columns:minmax(0,1fr) 340px}}
.map-box{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.map-box svg{display:block;width:100%;height:auto;touch-action:manipulation}
.map-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.layers{display:flex;gap:12px;flex-wrap:wrap;font-size:.85rem}
.layers label{display:flex;gap:6px;align-items:center;cursor:pointer}
.pin{cursor:pointer}
.pin:hover circle.dot,.pin:focus circle.dot{stroke-width:4}
.side{display:grid;gap:10px;align-content:start;max-height:640px;overflow:auto;padding-right:2px}
.near{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;text-align:left;width:100%}
.near:hover{border-color:var(--blue)}
.near .d{margin-left:auto;font-family:var(--f-mono);font-size:.8rem;color:var(--muted);white-space:nowrap}
.near .dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.near div{min-width:0}
.near small{color:var(--muted)}

.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.lg{display:inline-flex;align-items:center;gap:7px;padding:5px 12px 5px 8px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:.84rem;white-space:nowrap}
.lg svg{flex:none}
.lg small{color:var(--muted)}
/* profile */
.prof{display:grid;gap:20px}
@media (min-width:980px){.prof{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}}
.form{display:grid;gap:16px}
.form .two{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.toggles{display:flex;gap:6px;flex-wrap:wrap}
.toggles button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 10px;cursor:pointer;font-size:.84rem}
.toggles.have button[aria-pressed="true"]{background:color-mix(in srgb,var(--green) 18%,var(--surface));border-color:var(--green)}
.toggles.need button[aria-pressed="true"]{background:color-mix(in srgb,var(--orange) 18%,var(--surface));border-color:var(--orange)}
.sticky{position:sticky;top:80px}

/* vision page */
.vp{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.vp-head{padding:22px;display:flex;gap:18px;justify-content:space-between;align-items:flex-start;background:linear-gradient(120deg,color-mix(in srgb,var(--c) 14%,var(--surface)),var(--surface) 70%);border-bottom:1px solid var(--line);flex-wrap:wrap}
.vp-head .who{display:grid;gap:8px;min-width:0;flex:1 1 240px}
.vp-body{padding:22px;display:grid;gap:18px}
.vp-body section{display:grid;gap:6px}
.vp-body .tags{display:flex;gap:5px;flex-wrap:wrap}
.verified{font-size:.78rem;color:var(--green);font-weight:600}

/* contexts */
.bar-prog{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar-prog i{display:block;height:100%;background:var(--green);border-radius:99px}

/* modal + toast */
.overlay{position:fixed;inset:0;background:rgba(12,20,32,.5);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--bg);border-radius:20px;width:min(720px,100%);max-height:calc(100% - 24px);overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:1}
.modal-body{padding:20px;display:grid;gap:16px}
.x{border:0;background:var(--sunk);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:1.1rem;flex:none}
.slots{display:flex;gap:6px;flex-wrap:wrap}
.slots button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 10px;cursor:pointer;font-size:.85rem}
.slots button[aria-pressed="true"]{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 14%,var(--surface))}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;z-index:60;font-size:.9rem;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.demo{font-size:.8rem;color:var(--muted);text-align:center;padding-top:8px}
.conn{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line)}
.conn:first-child{border-top:0}
.status{font-size:.75rem;padding:2px 9px;border-radius:999px;background:color-mix(in srgb,var(--blue) 14%,transparent)}
.status.coffee{background:color-mix(in srgb,var(--coffee) 18%,transparent)}
.status.idea{background:color-mix(in srgb,var(--orange) 16%,transparent)}
.results-why{font-size:.84rem;color:var(--muted)}

/* cup */
.cup-wrap{display:grid;gap:24px;align-items:start}
@media (min-width:900px){.cup-wrap{grid-template-columns:minmax(0,1fr) 330px}}
.cup-stage{background:var(--sunk);border-radius:22px;padding:24px;display:grid;gap:18px;justify-items:center}
.cup{position:relative;width:min(320px,80vw);aspect-ratio:240/300;max-width:100%}
.cup > svg{position:absolute;inset:0;width:100%;height:100%}
.sleeve .q svg{display:block}
.sleeve{position:absolute;left:17%;right:17%;top:38.5%;height:33%;display:flex;gap:10px;align-items:center;color:#fff}
.sleeve .t{display:grid;gap:3px;min-width:0;font-size:.74rem;line-height:1.25}
.sleeve .t span:last-child{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sleeve .t b{font-size:.92rem;line-height:1.2}
.sleeve .q{flex:none;position:relative;border-radius:6px;overflow:hidden}
.scanline{position:absolute;left:0;right:0;height:3px;background:var(--blue);box-shadow:0 0 10px var(--blue);animation:scan .9s ease-in-out 1}
@keyframes scan{from{top:0}to{top:100%}}
.cup-ctrl{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.phone{border:10px solid var(--ink);border-radius:36px;background:var(--bg);min-height:520px;padding:18px 16px;display:grid;gap:14px;align-content:start;box-shadow:var(--shadow)}
.phone .notch{width:80px;height:6px;border-radius:9px;background:var(--line);justify-self:center}
.phone .ph-empty{display:grid;gap:10px;place-items:center;text-align:center;color:var(--muted);padding-top:120px}
.here{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.here:first-child{border-top:0}
.here .dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.here div{min-width:0;flex:1}
.here small{color:var(--muted)}
.roles{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.role{display:grid;gap:8px;align-content:start}
.role svg{width:56px;height:56px}
.role p{color:var(--muted);font-size:.93rem}
</style>

<header class="bar">
  <div class="bar-in">
    <button class="brand" data-act="nav" data-v="home" aria-label="Connect — მთავარი">
      <svg width="36" height="36" viewBox="0 0 40 40" aria-hidden="true">
        <circle cx="20" cy="20" r="17" fill="none" stroke="var(--blue)" stroke-width="2.4"/>
        <path d="M6 13 A17 17 0 0 1 27 4" fill="none" stroke="var(--primary)" stroke-width="3" stroke-linecap="round"/>
        <path d="M24 2.6 L27.6 4.2 L25 7.2" fill="none" stroke="var(--primary)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="34.5" cy="27" r="2.6" fill="var(--slate)"/><circle cx="5.5" cy="27" r="2.6" fill="var(--blue)"/>
        <path d="M13 16 h12 l-1.4 10.5 a2 2 0 0 1 -2 1.7 h-5.2 a2 2 0 0 1 -2 -1.7 z" fill="var(--coffee)"/>
        <path d="M25 18.5 h1.6 a2.6 2.6 0 0 1 0 5.2 h-2.1" fill="none" stroke="var(--coffee)" stroke-width="1.6"/>
      </svg>
      <b>Connect</b>
    </button>
    <nav id="nav" aria-label="გვერდები"></nav>
  </div>
</header>
<main id="view" class="view"></main>
<div id="layer"></div>

<script>
const SPH = {
  travel:{n:'მოგზაურობა',c:'var(--s-travel)'},
  edu:{n:'განათლება',c:'var(--s-edu)'},
  life:{n:'ყოფა და უბანი',c:'var(--s-life)'},
  biz:{n:'ბიზნესი',c:'var(--s-biz)'},
  culture:{n:'კულტურა',c:'var(--s-culture)'},
  social:{n:'სოციალური',c:'var(--s-social)'},
  health:{n:'ჯანმრთელობა და სპორტი',c:'var(--s-health)'},
  eco:{n:'ეკოლოგია',c:'var(--s-eco)'}
};
const HOODS = {
  'ნაძალადევი':[430,92],'დიდუბე':[300,48],'მარჯანიშვილი':[492,196],'ჩუღურეთი':[572,262],'ისანი':[792,322],'ავლაბარი':[682,404],

function ideaFor(a,b){
  for(const x of a.spheres) for(const y of b.spheres){
    if(x===y) continue;
    const k=[x,y].sort().join('|');
    if(IDEAS[k]) return {t:IDEAS[k][0],x:IDEAS[k][1]};
  }
  const g=b.haves.filter(t=>a.needs.includes(t));
  if(a.spheres.some(s=>b.spheres.includes(s))) return {t:'ერთობლივი ქსელი',x:`ერთი სფეროს ორი ორგანიზაცია აერთიანებს რესურსს (${[...a.haves.slice(0,1),...b.haves.slice(0,1)].join(', ')}) და ერთად სთავაზობს მომსახურებას უფრო დიდ აუდიტორიას.`};
  return {t:'ერთობლივი პილოტი',x:`სამთვიანი პილოტი, სადაც ${g[0]||b.haves[0]} და ${a.haves[0]} ერთად ქმნის ახალ შეთავაზებას.`};
}
function match(a,b){
  const give=b.haves.filter(t=>a.needs.includes(t));
  const get=a.haves.filter(t=>b.needs.includes(t));
  const shared=a.spheres.some(s=>b.spheres.includes(s));
  const d=dist(a,b);
  let s=give.length*3+get.length*3+(give.length&&get.length?2:0)+(shared?0.5:2)+(d<1.5?2:d<3?1:0);
  const reasons=[];
  if(give.length) reasons.push(`მათი შეთავაზება: <b>${give.join(', ')}</b>`);
  if(get.length) reasons.push(`თქვენი რესურსი: <b>${get.join(', ')}</b>`);
  if(!shared) reasons.push(`სხვადასხვა სფერო ერთმანეთს ავსებს: ${a.spheres.map(x=>SPH[x].n).join(', ')} + ${b.spheres.map(x=>SPH[x].n).join(', ')}`);
  if(d<3) reasons.push(`ახლოს ხართ — ${km(d)}`);
  return {o:b,s,pct:Math.min(97,Math.round(s/17*100)),give,get,d,reasons,idea:ideaFor(a,b)};
}
function ranked(){return ORGS.map(o=>match(me,o)).sort((x,y)=>y.s-x.s)}

function passes(o){return !sphereFilter.size||o.spheres.some(s=>sphereFilter.has(s))}

function qrSvg(seed,size=96){
  let h=2166136261;for(const ch of seed){h^=ch.codePointAt(0);h=Math.imul(h,16777619)}
  const N=21,c=size/N;let r='';
  const finder=(x,y)=>x<7&&y<7||x>=N-7&&y<7||x<7&&y>=N-7;
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    let on;
    if(finder(x,y)){const fx=x>=N-7?x-(N-7):x,fy=y>=N-7?y-(N-7):y;on=fx===0||fy===0||fx===6||fy===6||(fx>=2&&fx<=4&&fy>=2&&fy<=4)}
    else{h^=h<<13;h^=h>>>17;h^=h<<5;on=(h>>>0)%100<46}
    if(on)r+=`<rect x="${(x*c).toFixed(2)}" y="${(y*c).toFixed(2)}" width="${(c+.2).toFixed(2)}" height="${(c+.2).toFixed(2)}"/>`;
  }
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="ორგანიზაციის გვერდის QR კოდი (სადემონსტრაციო)"><rect width="${size}" height="${size}" rx="6" fill="#fff"/><g fill="#2a221c" transform="translate(${size*.06} ${size*.06}) scale(.88)">${r}</g></svg>`;
}

const VIEWS = [['home','მთავარი'],['feed','საერთო სივრცე'],['map','რუკა'],['match','Connect გთავაზობს'],['search','ძებნა'],['contexts','კონტექსტები'],['profile','შენი გვერდი']];

function sphereFilters(){return `<div class="filters">${Object.entries(SPH).map(([k,s])=>`<button class="fchip" style="--c:${s.c}" data-act="sph" data-k="${k}" aria-pressed="${sphereFilter.has(k)}">${s.n}</button>`).join('')}${sphereFilter.size?`<button class="fchip" data-act="sph-clear">ყველა</button>`:''}</div>`}

function networkArt(){
  const keys=Object.keys(SPH),R=138,cx=200,cy=200;
  const pts=keys.map((k,i)=>{const a=-Math.PI/2+i*2*Math.PI/keys.length;return {k,x:cx+R*Math.cos(a),y:cy+R*Math.sin(a),a}});
  const cross=[[0,1],[1,4],[2,3],[3,5],[5,7],[6,1],[0,7]];
  return `<svg viewBox="-78 -4 556 408" role="img" aria-label="რვა სფერო ერთ ქსელში">
    <circle cx="200" cy="200" r="${R}" fill="none" stroke="var(--line)" stroke-width="1.5"/>
    <g><circle cx="200" cy="200" r="176" fill="none" stroke="var(--blue)" stroke-width="2" stroke-dasharray="2 9" stroke-linecap="round"/>
      <path d="M58 96 A176 176 0 0 1 250 31" fill="none" stroke="var(--primary)" stroke-width="5" stroke-linecap="round"/>
      <path d="M240 22 L252 31 L241 41" fill="none" stroke="var(--primary)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><animateTransform attributeName="transform" type="rotate" from="0 200 200" to="360 200 200" dur="40s" repeatCount="indefinite"/></g>
    ${cross.map(([a,b])=>`<line x1="${pts[a].x}" y1="${pts[a].y}" x2="${pts[b].x}" y2="${pts[b].y}" stroke="var(--slate)" stroke-width="1.5" stroke-dasharray="4 5" opacity=".6"/>`).join('')}
    ${pts.map(p=>`<line x1="200" y1="200" x2="${p.x}" y2="${p.y}" stroke="${SPH[p.k].c}" stroke-width="1.5" opacity=".55"/>`).join('')}
    <circle cx="200" cy="200" r="46" fill="var(--surface)" stroke="var(--line)"/>
    <path d="M181 186 h38 l-4.5 32 a5 5 0 0 1 -5 4.4 h-19 a5 5 0 0 1 -5 -4.4 z" fill="var(--coffee)"/>
    <path d="M219 193 h5 a7 7 0 0 1 0 14 h-6" fill="none" stroke="var(--coffee)" stroke-width="3.2"/>
    <path d="M192 178 q4 -6 0 -12 M202 178 q4 -6 0 -12" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round"/>
    ${pts.map(p=>{const lx=200+(R+0)*Math.cos(p.a),ly=200+(R+0)*Math.sin(p.a);const tx=Math.cos(p.a)>.3?'start':Math.cos(p.a)<-.3?'end':'middle';const ox=Math.cos(p.a)*18,oy=Math.sin(p.a)*18+4;
      return `<circle cx="${lx}" cy="${ly}" r="11" fill="${SPH[p.k].c}" stroke="var(--surface)" stroke-width="3"/><text x="${lx+ox}" y="${ly+oy}" text-anchor="${tx}" font-size="12.5" fill="var(--ink)" font-family="var(--f-body)">${SPH[p.k].n.split(' ')[0]}</text>`}).join('')}
  </svg>`;
}

const STOP=new Set(['ვეძებ','ვინ','აკეთებს','რომ','და','ან','ჩვენ','მინდა','გვჭირდება','სჭირდება','ვინმე','სადმე','ახლოს','ჩემთან','არის','თვის','კაცზე','ადამიანზე','საღამოს','დილით','რომელიც']);
const stem=w=>w.length<=4?w:w.slice(0,Math.max(4,Math.min(5,w.length-2)));
function doSearch(q){
  const words=q.toLowerCase().replace(/[.,!?„“"]/g,' ').split(/\s+/).filter(w=>w.length>2&&!STOP.has(w)&&!/^\d+$/.test(w));
  if(!words.length) return [];
  const stems=words.map(stem);
  const hoodHit=Object.keys(HOODS).filter(h=>stems.some(s=>h.startsWith(s)||s.startsWith(h.slice(0,4))));
  return ORGS.filter(passes).map(o=>{
    let s=0;const why=[];
    const hit=(arr)=>arr.filter(t=>stems.some(st=>t.toLowerCase().includes(st)));
    const hv=hit(o.haves); if(hv.length){s+=hv.length*3;why.push('სთავაზობენ: '+hv.join(', '))}
    if(o.hidden&&stems.some(st=>o.hidden.toLowerCase().includes(st))){s+=3;why.push('ფარული რესურსი: '+o.hidden)}
    if(hoodHit.includes(o.hood)){s+=2;why.push('უბანი: '+o.hood)}
    const sp=o.spheres.filter(k=>stems.some(st=>SPH[k].n.toLowerCase().includes(st))); if(sp.length){s+=1.5;why.push('სფერო: '+sp.map(k=>SPH[k].n).join(', '))}
    const txt=(o.name+' '+o.type+' '+o.does+' '+o.vision+' '+o.ideas.map(i=>i.t+' '+i.need).join(' ')).toLowerCase();
    const tw=stems.filter(st=>txt.includes(st)); if(tw.length){s+=tw.length;if(!hv.length)why.push('აღწერაში ემთხვევა: '+tw.length+' სიტყვა')}
    const nd=hit(o.needs); if(nd.length){s+=.5}
    return {o,s,why};
  }).filter(r=>r.s>0).sort((a,b)=>b.s-a.s);
}

function render(){
  renderNav();
  const v={home:renderHome,feed:renderFeed,map:renderMap,match:renderMatch,search:renderSearch,contexts:renderContexts,profile:renderProfile}[view]||renderHome;
  $('#view').innerHTML=v();
}
function go(v){view=v;if(v!=='profile')draft=null;try{history.replaceState(null,'','#'+v)}catch(e){}render();window.scrollTo({top:0,behavior:'instant'})}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act;
  if(a==='close-bg'&&e.target!==el)return;
  if(el.tagName==='INPUT')return; // checkboxes handled on change
  switch(a){
    case 'nav':modal=null;drawModal();go(el.dataset.v);break;
    case 'sph':{const k=el.dataset.k;sphereFilter.has(k)?sphereFilter.delete(k):sphereFilter.add(k);render();break}
    case 'sph-clear':sphereFilter.clear();render();break;
    case 'feed-mode':feedMode=el.dataset.m;render();break;
    case 'radius':radius=+el.dataset.r;render();break;
    case 'open-org':openOrg(el.dataset.id);break;
    case 'connect':openConnect(el.dataset.id,el.dataset.m);break;
    case 'cmode':modal.mode=el.dataset.m;drawModal();break;
    case 'slot':modal.slot=el.dataset.k;drawModal();break;
    case 'close':case 'close-bg':modal=null;drawModal();break;
    case 'send':{
      const o=byId(modal.id);let note='';
      if(modal.mode==='coffee'){if(!modal.slot){toast('აირჩიე შეხვედრის დრო');return}note=modal.slot+' · '+($('#m-place')?.value||'')}
      if(modal.mode==='idea'){const r=document.querySelector('input[name="m-idea"]:checked');note='„'+o.ideas[r?+r.value:0].t+'“'}
      connections=connections.filter(c=>c.id!==o.id);connections.push({id:o.id,mode:modal.mode,note});
      modal=null;drawModal();render();
      toast(`გაიგზავნა: ${o.name} — პასუხს „შენს გვერდზე“ ნახავ`);break}
    case 'scan':if(scanning)return;scanning=true;render();setTimeout(()=>{scanning=false;scanned=true;phoneTab='idea';render()},900);break;
    case 'nextcup':cupIdx++;scanned=false;render();break;
    case 'cafe':cafeIdx=+el.dataset.i;scanned=false;render();break;
    case 'ptab':phoneTab=el.dataset.k;render();break;
    case 'wave':{const o=byId(el.dataset.id);connections=connections.filter(c=>c.id!==o.id);connections.push({id:o.id,mode:'coffee',note:'აქვე, მაგიდა '+el.dataset.t+' · '+CAFES[cafeIdx].name});toast(`${o.name} მიიღებს შეტყობინებას: მაგიდა 6-დან გესალმებიან`);break}
    case 'dismiss':dismissed.add(el.dataset.id);render();break;
    case 'undismiss':dismissed.clear();render();break;
    case 'blind':{const pool=ranked().filter(m=>!m.o.spheres.some(s=>me.spheres.includes(s))).slice(0,6);const pick=pool[Math.floor(Math.random()*pool.length)]||ranked()[0];blind={id:pick.o.id};render();break}
    case 'blind-ok':connections=connections.filter(c=>c.id!==blind.id);connections.push({id:blind.id,mode:'blind',note:dlabel(nextThursday())+', 10:00 · Connect Coffee · ვერა'});toast('ბრმა ყავა დაჯავშნილია');blind=null;render();break;
    case 'ex':query=el.dataset.q;render();break;
    case 'join':{const c=contexts.find(x=>x.id===el.dataset.id);c.joined=!c.joined;c.members+=c.joined?1:-1;render();if(c.joined)toast('შეუერთდი: '+c.name);break}
    case 'ctx-sph':el.setAttribute('aria-pressed',el.getAttribute('aria-pressed')!=='true');break;
    case 'p-sph':{const k=el.dataset.k;draft.spheres=draft.spheres.includes(k)?draft.spheres.filter(x=>x!==k):[...draft.spheres,k];if(!draft.spheres.length)draft.spheres=[k];el.setAttribute('aria-pressed',draft.spheres.includes(k));refreshPreview();break}
    case 'p-tag':{const w=el.dataset.w,t=el.dataset.t;draft[w]=draft[w].includes(t)?draft[w].filter(x=>x!==t):[...draft[w],t];el.setAttribute('aria-pressed',draft[w].includes(t));refreshPreview();break}
    case 'p-reset':draft=JSON.parse(JSON.stringify(DEFAULT_ME));render();break;
  }
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.act==='layer'){layers[el.dataset.l]=el.checked;render()}
  if(el.name==='m-idea'&&modal)modal.idea=+el.value;
  if(el.id==='m-place'&&modal)modal.place=el.value;
  if(el.id==='p-hood'&&draft){const [x,y]=HOODS[el.value];draft.hood=el.value;draft.x=x+18;draft.y=y+16;refreshPreview()}
});
document.addEventListener('input',e=>{
  if(!draft)return;const id=e.target.id;
  const map={'p-name':'name','p-type':'type','p-does':'does','p-vision':'vision','p-hidden':'hidden'};
  if(map[id]){draft[map[id]]=e.target.value;refreshPreview()}
  if(id==='p-idea'||id==='p-ineed'){draft.ideas=[{t:$('#p-idea').value,need:$('#p-ineed').value}].filter(i=>i.t);refreshPreview()}
});
document.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='sform'){query=$('#q').value.trim();render()}
  if(e.target.id==='pform'){me=JSON.parse(JSON.stringify(draft));if(!me.hidden)delete me.hidden;save('connect-me',me);dismissed.clear();toast('გვერდი შენახულია — შეთავაზებები განახლდა');go('match')}
  if(e.target.id==='cform'){
    const name=$('#c-name').value.trim();if(!name){toast('დაწერე კონტექსტის სახელი');return}
    const sp=[...document.querySelectorAll('#c-sph [aria-pressed="true"]')].map(b=>b.dataset.k);
    contexts.unshift({id:'c'+Date.now(),name,hood:me.hood,desc:$('#c-desc').value.trim()||'ახალი კონტექსტი — შემოუერთდით და ერთად განვავითაროთ.',spheres:sp.length?sp:me.spheres,members:1,joined:true,by:me.name});
    render();toast('კონტექსტი გამოქვეყნდა');
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&modal){modal=null;drawModal()}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('g.pin')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}
});
function refreshPreview(){const p=$('#preview');if(p)p.innerHTML=visionPage(draft,true)}

const start=(location.hash||'').slice(1);
if(VIEWS.some(([v])=>v===start))view=start;
render();
</script>

</body>
</html>
